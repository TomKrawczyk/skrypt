<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skrypt Sprzedażowy - Ecofundacja</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📞 Skrypt Sprzedażowy</h1>
            <p>Ecofundacja - Konsultacje Energetyczne</p>
        </div>

        <div class="path-indicator">
            <div class="path-step active" id="pathStep"></div>
        </div>

        <div class="content-area" id="contentArea">
            <!-- Treść będzie dynamicznie ładowana przez JavaScript -->
        </div>

        <div class="history-panel" id="historyPanel">
            <h3>📋 Historia rozmowy</h3>
            <div class="history-list" id="historyList"></div>
        </div>

        <button class="reset-btn" id="resetBtn">🔄 Rozpocznij od nowa</button>
    </div>

    <script src="js/script-flow.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
